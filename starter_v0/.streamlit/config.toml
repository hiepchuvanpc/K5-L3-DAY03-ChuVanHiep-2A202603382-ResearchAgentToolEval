[browser]
gatherUsageStats = false

[theme]
font = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
baseRadius = "0.6rem"
showWidgetBorder = true
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
greenColor = "#0ca30c"
redColor = "#d03b3b"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#242423"
textColor = "#f0efec"
borderColor = "#2c2c2a"
greenColor = "#0ca30c"
redColor = "#d03b3b"
